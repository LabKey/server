import org.labkey.gradle.plugin.extension.ServerDeployExtension
import org.labkey.gradle.task.CheckForVersionConflicts
import org.labkey.gradle.util.BuildUtils
import org.labkey.gradle.util.GroupNames
import org.labkey.gradle.util.PomFileHelper

plugins {
    id "java"
    id "maven-publish"
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "1.0.8.RELEASE"
}

// 'dependency-management' plugin doesn't allow us to use 'resolutionStrategy.force' to lock versions
ext['log4j2.version'] = log4j2Version
ext['netty.version'] = nettyVersion

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    embedded
}

configurations.configureEach {
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
}

dependencies {
    // Needed to support composite Log4j2 plugins using JSONLayout elements
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonAnnotationsVersion}"

    // Pull in Tomcat as a servlet container, without Spring MVC
    implementation("org.springframework.boot:spring-boot-starter-tomcat:${springBootVersion}") {
        exclude group: "jakarta.annotation", module: "jakarta.annotation-api" // Already present in tomcat-annotations-api
        exclude group: "org.apache.tomcat.embed", module: "tomcat-embed-core" // We want to force apacheTomcatVersion
    }

    // Allows forcing a Jackson version that differs from spring-boot's version (e.g., to address CVEs)
    implementation('tools.jackson.core:jackson-databind') {
        version {
            strictly "${jackson3Version}"
        }
    }
    implementation('tools.jackson.core:jackson-core') {
        version {
            strictly "${jackson3Version}"
        }
    }
    implementation('tools.jackson:jackson-bom') {
        version {
            strictly "${jackson3Version}"
        }
    }

    // Allows forcing a Spring Framework version that differs from spring-boot's version (e.g., to address CVEs)
    implementation('org.springframework:spring-aop') {
        version {
            strictly "${springVersion}"
        }
    }
    implementation('org.springframework:spring-beans') {
        version {
            strictly "${springVersion}"
        }
    }
    implementation('org.springframework:spring-context') {
        version {
            strictly "${springVersion}"
        }
    }
    implementation('org.springframework:spring-core') {
        version {
            strictly "${springVersion}"
        }
    }
    implementation('org.springframework:spring-expression') {
        version {
            strictly "${springVersion}"
        }
    }
    implementation('org.springframework:spring-web') {
        version {
            strictly "${springVersion}"
        }
    }

    // Allows forcing a Tomcat version that differs from spring-boot's version (e.g., to address CVEs or regressions,
    // or to test a Tomcat release candidate)
    implementation('org.apache.tomcat.embed:tomcat-embed-core') {
        version {
            strictly "${apacheTomcatVersion}"
        }
    }
    implementation('org.apache.tomcat.embed:tomcat-embed-el') {
        version {
            strictly "${apacheTomcatVersion}"
        }
    }
    implementation('org.apache.tomcat.embed:tomcat-embed-websocket') {
        version {
            strictly "${apacheTomcatVersion}"
        }
        exclude group: "org.apache.tomcat.embed", module: "tomcat-embed-core" // We want to force apacheTomcatVersion
    }
    implementation('org.apache.tomcat:tomcat-annotations-api') {
        version {
            strictly "${apacheTomcatVersion}"
        }
    }

    runtimeOnly "org.apache.tomcat.embed:tomcat-embed-jasper:${apacheTomcatVersion}"
    runtimeOnly("org.apache.tomcat:tomcat-dbcp:${apacheTomcatVersion}") {
        exclude group: "org.apache.tomcat", module: "tomcat-juli"
    }
    implementation ("org.apache.logging.log4j:log4j-slf4j2-impl:${log4j2Version}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    implementation "software.amazon.awssdk:ssm:${awsSdkVersion}"
    implementation "software.amazon.awssdk:sso:${awsSdkVersion}"
    implementation "software.amazon.awssdk:ssooidc:${awsSdkVersion}"

    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4j2Version}"

    developmentOnly("org.springframework.boot:spring-boot-devtools")

    // Process sources using `log4j-core` providing `org.apache.logging.log4j.core.config.plugins.processor.PluginProcessor` that generates `Log4j2Plugins.dat` -->
    annotationProcessor("org.apache.logging.log4j:log4j-core:${log4j2Version}")

    // Exclude Spring Boot's default logging framework so we can direct it to log through Log4J
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    // Add Log4j2 Starter to get Spring Boot logging captured consistently with the rest of our logging
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
}

BuildUtils.addLabKeyDependency(project: project, config: "implementation", depProjectPath: BuildUtils.getBootstrapProjectPath(gradle))

project.tasks.register(
    "checkVersionConflicts", CheckForVersionConflicts)
        { CheckForVersionConflicts task ->
            task.group = GroupNames.BUILD
            task.description = "Check for conflicts in version numbers of jar file and files already in the build directory ${ServerDeployExtension.getEmbeddedServerDeployDirectoryPath(project)}. " +
                    "Default action on detecting a conflict is to fail. Use -PversionConflictAction=[delete|fail|warn] to change this behavior. The value 'delete' will cause the " +
                    "conflicting version(s) in the ${ServerDeployExtension.getEmbeddedServerDeployDirectoryPath(project)} directory to be removed."
            task.directory = new File(ServerDeployExtension.getEmbeddedServerDeployDirectoryPath(project))
            task.extension = "jar"
            task.cleanTask = "server:cleanEmbeddedDeploy"
            task.collection = project.tasks.bootJar.outputs.files
        }

// A module that ships classes BOOT-INF/lib already defines gets a second, distinct copy of those types, so handing an
// instance across the classloader boundary throws LinkageError. LabKeySpringBootClassLoader.filter() defers the
// packages we knowingly share; this catches everything else at build time instead of at startup.
project.tasks.register("checkBootClasspathDuplicates")
        { Task task ->
            task.group = GroupNames.VERIFICATION
            task.description = "Fail when a deployed module ships a jar whose classes are already in the embedded jar's BOOT-INF/lib and " +
                    "aren't listed in bootClasspathDuplicates.txt. Use -PbootClasspathDuplicatesAction=[fail|warn] to change the behavior."

            File baselineFile = project.file("bootClasspathDuplicates.txt")
            File modulesDir = new File(ServerDeployExtension.getModulesDeployDirectory(project))
            String action = project.hasProperty("bootClasspathDuplicatesAction") ? project.property("bootClasspathDuplicatesAction") : "fail"
            FileCollection bootJarFiles = project.tasks.bootJar.outputs.files

            task.inputs.files(bootJarFiles)
            task.inputs.file(baselineFile)
            task.inputs.files(project.fileTree(dir: modulesDir, include: "*.module"))
            task.outputs.file(project.layout.buildDirectory.file("bootClasspathDuplicates-report.txt"))

            task.doLast {
                def classNames = { InputStream is ->
                    Set<String> names = new HashSet<>()
                    new java.util.zip.ZipInputStream(is).withCloseable { jar ->
                        for (def entry = jar.nextEntry; entry != null; entry = jar.nextEntry)
                        {
                            String name = entry.name
                            if (name.endsWith(".class") && !name.endsWith("module-info.class") && !name.startsWith("META-INF/"))
                                names.add(name)
                        }
                    }
                    return names
                }
                // Strip the version so the baseline survives routine version bumps
                def baseName = { String fileName -> fileName.replaceFirst(/-\d[^\/]*\.(jar|module)$/, "").replaceFirst(/\.(jar|module)$/, "") }

                // Gradle can't call the task up to date unless the declared output exists, even with nothing to check
                File report = task.outputs.files.singleFile
                report.parentFile.mkdirs()

                if (!modulesDir.isDirectory())
                {
                    logger.lifecycle("No deployed modules in ${modulesDir}, skipping boot classpath duplicate check")
                    report.text = ""
                    return
                }

                Set<String> bootClasses = new HashSet<>()
                new java.util.zip.ZipFile(bootJarFiles.singleFile).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.name.startsWith("BOOT-INF/lib/") && entry.name.endsWith(".jar"))
                            bootClasses.addAll(classNames(zip.getInputStream(entry)))
                    }
                }

                Set<String> found = new TreeSet<>()
                modulesDir.listFiles({ File dir, String name -> name.endsWith(".module") } as FilenameFilter).each { File moduleFile ->
                    new java.util.zip.ZipFile(moduleFile).withCloseable { zip ->
                        zip.entries().each { entry ->
                            if (entry.name.startsWith("lib/") && entry.name.endsWith(".jar") &&
                                    !Collections.disjoint(classNames(zip.getInputStream(entry)), bootClasses))
                                found.add(baseName(moduleFile.name) + ":" + baseName(new File(entry.name).name))
                        }
                    }
                }

                Set<String> baseline = new TreeSet<>()
                baselineFile.eachLine("UTF-8") { String line ->
                    String trimmed = line.trim()
                    if (!trimmed.isEmpty() && !trimmed.startsWith("#"))
                        baseline.add(trimmed)
                }

                Set<String> added = new TreeSet<>(found)
                added.removeAll(baseline)
                Set<String> stale = new TreeSet<>(baseline)
                stale.removeAll(found)

                report.text = found.isEmpty() ? "" : found.join("\n") + "\n"

                if (!stale.isEmpty())
                    logger.info("These bootClasspathDuplicates.txt entries no longer duplicate anything in BOOT-INF/lib and can be removed once every module that could contribute them is enlisted: {}", stale.join(", "))

                if (!added.isEmpty())
                {
                    String message = "These modules ship jars whose classes are already in the embedded jar's BOOT-INF/lib:\n    " +
                            added.join("\n    ") +
                            "\nEither exclude the jar from the module's dependencies, or -- if both copies are genuinely needed -- defer the " +
                            "package to the parent in LabKeySpringBootClassLoader.filter() and add these lines to " + baselineFile
                    if ("warn".equalsIgnoreCase(action))
                        logger.warn(message)
                    else
                        throw new GradleException(message)
                }
            }
        }

project.publishing {
    publications {
        embeddedJar(MavenPublication) {
            groupId = 'org.labkey.build'
            artifactId = 'embedded'
            version = project.version
            artifact project.tasks.bootJar.outputs.files.singleFile
            pom {
                name = "LabKey Server Embedded"
                description = "Embedded Tomcat, Spring Boot, and the LabKey classes that configure these components"
                developers PomFileHelper.getLabKeyTeamDevelopers()
                licenses PomFileHelper.getApacheLicense()
                organization PomFileHelper.getLabKeyOrganization()
                scm PomFileHelper.getLabKeyGitScm()
            }
        }

        if (BuildUtils.shouldPublish(project))
        {
            project.artifactoryPublish {
                publications('embeddedJar')
            }
            project.artifactoryPublish.skip = false
        }
    }
}

project.artifacts {
    embedded project.tasks.bootJar
}

// The primary artifact from this build should be the jar produced from the bootJar task as that contains
// the SpringBoot classes. This default jar task produces a jar file containing only the classes from src,
// which no one really needs. If produced, this is the jar file that will be used in distributions, making
// them not really embedding anything.
jar {
 onlyIf { false }
}
