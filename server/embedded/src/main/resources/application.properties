# Defaults for the embedded server. Spring Boot merges these below the deployment's own application.properties, so
# anything here can be overridden by an admin without editing the boot jar. Keep runtime-derived values (anything read
# from a system property or computed at startup) in LabKeyServer.main() instead -- this file is static text.

server.tomcat.basedir=.
server.tomcat.accesslog.directory=${labkey.log.home}

# Boost limits imposed by Tomcat v10.1.42
server.tomcat.max-part-count=500
# GitHub Issue 161: LKS insert forms can't handle long file field names
server.tomcat.max-part-header-size=1024
server.tomcat.max-connections=250
# Boost limit back to Tomcat 10 level
server.tomcat.max-parameter-count=10000

# Enable HTTP compression for response content. Spring Boot compresses HTML, JSON and other types by default, but not
# TSV, CSV, or SVG, so we have to duplicate the defaults and add those types.
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,text/tab-separated-values,text/csv,image/svg+xml

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %S %I "%{Referer}i" "%{User-Agent}i" %{LABKEY.username}s %{X-Forwarded-For}i
jsonaccesslog.pattern=%h %t %m %U %s %b %D %S "%{Referer}i" "%{User-Agent}i" %{LABKEY.username}s %{X-Forwarded-For}i

# Issue 52415: Omit stack traces from Tomcat error pages by default, but propagate error messages
server.error.include-stacktrace=never
server.error.include-message=always

# A strong Content Security Policy. The ${...} substitutions other than context.contextPath are resolved by LabKey's
# CSP filter at request time, not by Spring; unresolvable placeholders are left intact during binding.
csp.enforce=\
    default-src 'self' ;\n\
    connect-src 'self' ${CONNECTION.SOURCES} ;\n\
    object-src ${OBJECT.SOURCES} ;  /* Substitution value defaults to 'none' unless overridden by an admin */\n\
    style-src 'self' 'unsafe-inline' ${STYLE.SOURCES} ;\n\
    img-src 'self' data: ${IMAGE.SOURCES} ;\n\
    font-src 'self' data: ${FONT.SOURCES} ;\n\
    script-src 'unsafe-eval' 'strict-dynamic' 'nonce-${REQUEST.SCRIPT.NONCE}' ${SCRIPT.SOURCES} ;\n\
    base-uri 'self' ;\n\
    frame-src 'self' ${FRAME.SOURCES} ;\n\
    report-uri ${context.contextPath:}/admin-contentSecurityPolicyReport.api ;\n\
    ${UPGRADE.INSECURE.REQUESTS}\n\
    frame-ancestors 'self' ${FRAMEANCESTORS.SOURCES} ;\n\
    /* cspVersion=e16 */\n

# The report policy leaves out upgrade_insecure_requests and frame-ancestors, since they produce warnings on some browsers
csp.report=\
    default-src 'self' ;\n\
    connect-src 'self' ${CONNECTION.SOURCES} ;\n\
    object-src ${OBJECT.SOURCES} ;  /* Substitution value defaults to 'none' unless overridden by an admin */\n\
    style-src 'self' 'unsafe-inline' ${STYLE.SOURCES} ;\n\
    img-src 'self' data: ${IMAGE.SOURCES} ;\n\
    font-src 'self' data: ${FONT.SOURCES} ;\n\
    script-src 'unsafe-eval' 'strict-dynamic' 'nonce-${REQUEST.SCRIPT.NONCE}' ${SCRIPT.SOURCES} ;\n\
    base-uri 'self' ;\n\
    frame-src 'self' ${FRAME.SOURCES} ;\n\
    report-uri ${context.contextPath:}/admin-contentSecurityPolicyReport.api ;\n\
    /* cspVersion=r16 */\n

# GitHub Issue 692: Stop using CBC in HTTPS ciphers. These settings configure HTTPS; admins must opt in with additional
# settings, like the key store. Without those, HTTP-only startup fails unless server.ssl.enabled is explicitly false.
server.ssl.enabled=false
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
# Explicit JSSE cipher suite names, to avoid CBC-mode suites
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
server.ssl.use-cipher-suites-order=true

# GitHub Issue #1416 - default values for SMTP timeouts
mail.smtpConnectionTimeout=10000
mail.smtpTimeout=60000
# Unlike the socket-level timeouts above, JavaMail implements writetimeout with a ScheduledThreadPool per connection - one per message, since Transport.send() doesn't pool
mail.smtpWriteTimeout=60000
